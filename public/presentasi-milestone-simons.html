<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Presentasi Milestone — SIMONS · FSHI IAIN Bone</title>
    <link rel="icon" href="logoiainbone.png" type="image/png">
    <link rel="preconnect" href="https://fonts.bunny.net">
    <link href="https://fonts.bunny.net/css?family=fraunces:550,650,700|manrope:400,500,600,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #0f241c;
            --forest: #14532d;
            --leaf: #166534;
            --mist: #ecfdf3;
            --paper: #f4fbf6;
            --line: rgba(20, 83, 45, 0.14);
            --muted: rgba(15, 36, 28, 0.68);
            --white: #fff;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; }
        body {
            font-family: Manrope, sans-serif;
            color: var(--ink);
            background: #0b1f16;
        }
        .deck {
            height: 100%;
            display: grid;
            grid-template-rows: 1fr auto;
        }
        .viewport {
            position: relative;
            overflow: hidden;
        }
        .slide {
            position: absolute;
            inset: 0;
            display: none;
            padding: clamp(1.5rem, 4vh, 2.75rem) clamp(1.75rem, 5vw, 4.5rem) 4.5rem;
            background:
                radial-gradient(circle at 8% 0%, rgba(34, 197, 94, 0.14), transparent 34%),
                linear-gradient(165deg, #f7fdf8 0%, var(--paper) 48%, #eef7f1 100%);
            overflow: auto;
        }
        .slide.is-on { display: block; }
        .slide.cover {
            background:
                linear-gradient(135deg, rgba(11, 40, 24, 0.94), rgba(20, 83, 45, 0.9)),
                url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M0 0h40v40H0V0zm40 40h40v40H40V40z'/%3E%3C/g%3E%3C/svg%3E");
            color: var(--white);
        }
        .slide.cover .kicker,
        .slide.cover .muted { color: rgba(255,255,255,.78); }
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1.4rem;
        }
        .logos { display: flex; align-items: center; gap: .75rem; }
        .logos img { height: 2.6rem; width: auto; object-fit: contain; }
        .brand { min-width: 0; }
        .brand strong { display: block; font-size: .92rem; letter-spacing: .04em; }
        .brand span { display: block; font-size: .68rem; opacity: .72; }
        .kicker {
            margin: 0 0 .45rem;
            font-size: .78rem;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--leaf);
        }
        h1, h2, h3 { font-family: Fraunces, Georgia, serif; margin: 0; letter-spacing: .01em; }
        h1 { font-size: clamp(2.4rem, 6vw, 4.2rem); line-height: 1.08; }
        h2 { font-size: clamp(1.55rem, 3.4vw, 2.35rem); color: var(--forest); line-height: 1.2; }
        .slide.cover h2 { color: var(--white); }
        .lead { margin: .85rem 0 0; max-width: 42rem; font-size: 1.05rem; line-height: 1.6; }
        .muted { color: var(--muted); }
        .grid { display: grid; gap: .85rem; margin-top: 1.15rem; }
        .cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        .card {
            background: var(--white);
            border: 1px solid var(--line);
            border-radius: 1rem;
            padding: 1rem 1.1rem;
        }
        .slide.cover .card {
            background: rgba(255,255,255,.08);
            border-color: rgba(255,255,255,.16);
        }
        .card h3 { font-size: 1.05rem; color: var(--forest); margin-bottom: .35rem; }
        .slide.cover .card h3 { color: #dcfce7; }
        .card p, .card li { margin: 0; font-size: .92rem; line-height: 1.5; color: var(--muted); }
        .slide.cover .card p { color: rgba(255,255,255,.86); }
        ul.clean { margin: .7rem 0 0; padding: 0 0 0 1.1rem; }
        ul.clean li { margin: .35rem 0; line-height: 1.5; }
        .flow {
            display: flex;
            flex-wrap: wrap;
            gap: .5rem;
            margin-top: 1rem;
            align-items: center;
        }
        .chip {
            background: var(--white);
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: .45rem .85rem;
            font-size: .82rem;
            font-weight: 700;
            color: var(--forest);
        }
        .chip.arrow { border: 0; background: transparent; color: var(--leaf); padding: 0 .1rem; }
        .banner {
            margin-top: 1.15rem;
            padding: 1rem 1.2rem;
            border-radius: 1rem;
            font-family: Fraunces, Georgia, serif;
            font-size: clamp(1.15rem, 2.4vw, 1.55rem);
            line-height: 1.35;
        }
        .slide.cover .banner {
            background: rgba(74, 222, 128, 0.16);
            border: 1px solid rgba(74, 222, 128, 0.45);
            color: #ecfdf3;
        }
        .notice-pill {
            display: inline-block;
            background: #fbbf24;
            color: #1c1917;
            font-size: .78rem;
            font-weight: 800;
            letter-spacing: .1em;
            text-transform: uppercase;
            border-radius: 999px;
            padding: .35rem .85rem;
            margin-bottom: .55rem;
        }
        .need-stamp {
            display: inline-block;
            background: #b91c1c;
            color: #fff;
            font-size: .8rem;
            font-weight: 800;
            letter-spacing: .12em;
            text-transform: uppercase;
            border-radius: .45rem;
            padding: .4rem .75rem;
        }
        .prinsip {
            display: flex;
            flex-wrap: wrap;
            gap: .4rem;
            margin-top: .85rem;
        }
        .prinsip span {
            background: #dcfce7;
            color: #14532d;
            border-radius: 999px;
            padding: .32rem .7rem;
            font-size: .78rem;
            font-weight: 700;
        }
        table.simple td:first-child { font-weight: 700; color: var(--forest); min-width: 9.5rem; }
        .status { display: inline-block; font-size: .72rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; border-radius: 999px; padding: .22rem .55rem; }
        .done { background: #dcfce7; color: #166534; }
        .now { background: #fef3c7; color: #92400e; }
        .next { background: #e0e7ff; color: #3730a3; }
        table.simple { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: .9rem; }
        table.simple th, table.simple td { text-align: left; padding: .65rem .7rem; border-bottom: 1px solid var(--line); vertical-align: top; }
        table.simple th { color: var(--forest); font-size: .78rem; letter-spacing: .04em; text-transform: uppercase; }
        .bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: .7rem 1.25rem;
            background: #082016;
            color: #d7efe1;
            font-size: .82rem;
        }
        .nav-btns { display: flex; gap: .45rem; }
        .nav-btns button, .hint-key {
            border: 1px solid rgba(255,255,255,.16);
            background: rgba(255,255,255,.06);
            color: #fff;
            border-radius: .55rem;
            padding: .4rem .7rem;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }
        .progress { flex: 1; height: 4px; background: rgba(255,255,255,.12); border-radius: 99px; overflow: hidden; max-width: 18rem; }
        .progress > span { display: block; height: 100%; background: #4ade80; width: 0; }
        .bagan {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: .28rem;
            margin-top: 1rem;
        }
        .node {
            background: var(--white);
            border: 1.5px solid var(--line);
            border-radius: .8rem;
            padding: .5rem .9rem;
            text-align: center;
            min-width: 10.5rem;
            max-width: 22rem;
        }
        .node b { display: block; color: var(--forest); font-size: .88rem; }
        .node small { display: block; margin-top: .15rem; color: var(--muted); font-size: .72rem; font-weight: 500; line-height: 1.35; }
        .node.gate { background: var(--mist); }
        .node.ok { background: #f0fdf4; border-color: #86efac; }
        .node.stop { background: #fef2f2; border-color: #fecaca; }
        .node.wide { min-width: 16rem; }
        .v { color: var(--leaf); font-weight: 800; font-size: 1rem; line-height: 1; }
        .v span { display: block; font-size: .68rem; font-weight: 700; color: var(--muted); }
        .split {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: .55rem;
            align-items: stretch;
            width: min(34rem, 100%);
        }
        .split .col { display: flex; flex-direction: column; align-items: center; gap: .28rem; }
        .split .mid {
            display: flex;
            align-items: center;
            color: var(--leaf);
            font-size: .72rem;
            font-weight: 800;
            letter-spacing: .04em;
            text-transform: uppercase;
        }
        .lane {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: .65rem;
            width: 100%;
            margin-top: 1rem;
        }
        .lane .node { min-width: 0; width: 100%; }
        @media (max-width: 860px) {
            .cols-2, .cols-3, .cols-4, .lane { grid-template-columns: 1fr; }
            .logos img { height: 2.1rem; }
        }
        @media print {
            body { background: #fff; }
            .bar { display: none; }
            .slide { position: relative; display: block !important; page-break-after: always; min-height: 100vh; overflow: visible; }
        }
    </style>
</head>
<body>
    <div class="deck">
        <div class="viewport" id="viewport"></div>
        <div class="bar">
            <span id="counter">1 / 1</span>
            <div class="progress"><span id="fill"></span></div>
            <div class="nav-btns">
                <button type="button" id="prev" aria-label="Sebelumnya">←</button>
                <button type="button" id="next" aria-label="Berikutnya">→</button>
            </div>
            <span>← → atau spasi · F untuk layar penuh</span>
        </div>
    </div>

    <template id="slides">
        <section class="slide cover">
            <div class="topbar">
                <div class="logos">
                    <img src="logokemenag.png" alt="Logo Kementerian Agama">
                    <img src="logoiainbone.png" alt="Logo IAIN Bone">
                    <div class="brand">
                        <strong>Fakultas Syariah dan Hukum Islam</strong>
                        <span>Institut Agama Islam Negeri Bone</span>
                    </div>
                </div>
            </div>
            <p class="kicker">Presentasi milestone proyek</p>
            <h1>SIMONS</h1>
            <p class="lead">Sistem Manajemen Operasional Non Srikandi — digitalisasi alur SK skripsi dari usulan mahasiswa hingga penerbitan surat keputusan Dekan.</p>
            <p class="lead" style="max-width:44rem;font-weight:700;">Karya ini adalah bukti layanan digital FSHI yang mendukung SPBE IAIN Bone.</p>
            <div class="grid cols-3" style="margin-top:2rem;">
                <div class="card"><h3>SK Pembimbing</h3><p>Sudah beroperasi: form, verifikasi, PDF, email, tracking.</p></div>
                <div class="card"><h3>SK Penguji</h3><p>Sudah beroperasi: gerbang NIM, usulan Kaprodi, alur sama.</p></div>
                <div class="card"><h3>Munaqasyah &amp; AI</h3><p>Fondasi data siap; undangan dan model AI belum dibangun.</p></div>
            </div>
        </section>

        <section class="slide cover">
            <div class="topbar">
                <div class="logos">
                    <img src="logokemenag.png" alt="Logo Kementerian Agama">
                    <img src="logoiainbone.png" alt="Logo IAIN Bone">
                    <div class="brand">
                        <strong>Untuk Rektor, Wakil Rektor, dan Dekan</strong>
                        <span>Baca halaman ini sebelum milestone teknis</span>
                    </div>
                </div>
                <span class="notice-pill">Pesan utama</span>
            </div>
            <p class="kicker">Halaman 2 · dukungan SPBE</p>
            <h1>Karya ini sangat mendukung SPBE</h1>
            <div class="banner">
                SIMONS adalah bukti layanan digital FSHI yang sudah bertransaksi: mahasiswa mengajukan daring, pimpinan memverifikasi sesuai wewenang, SK terbit ber-QR dan bisa diaudit. Ini kontribusi konkret IAIN Bone pada Sistem Pemerintahan Berbasis Elektronik.
            </div>
            <p class="lead">Perpres Nomor 95 Tahun 2018 mewajibkan instansi memakai TIK untuk memberi layanan — bukan hanya memiliki komputer. Tanpa karya seperti ini, pimpinan sulit menunjukkan bukti saat asesmen indeks SPBE.</p>
            <div class="grid cols-3" style="margin-top:1.6rem;">
                <div class="card">
                    <h3>Wajib, bukan tren IT</h3>
                    <p>SPBE adalah mandat Presiden. IAIN Bone sebagai PTKIN/satker Kemenag dinilai kematangan layanannya, termasuk layanan mahasiswa di fakultas.</p>
                </div>
                <div class="card">
                    <h3>Pimpinan yang dimintai bukti</h3>
                    <p>Asesor tidak menerima janji. Mereka minta aplikasi yang jalan, proses yang terdokumentasi, dan jejak siapa memutuskan kapan.</p>
                </div>
                <div class="card">
                    <h3>Sudah tingkat transaksi</h3>
                    <p>Form → verifikasi berjenjang → PDF + QR + email. Itu kematangan layanan tingkat 3, bukan sekadar pengumuman di website.</p>
                </div>
            </div>
        </section>

        <section class="slide">
            <p class="kicker">Aturan resmi pemerintah</p>
            <h2>Dasar hukum SPBE yang mengikat pimpinan</h2>
            <p class="lead muted">Ini peraturan yang berlaku, bukan opini pengembang. IAIN Bone sebagai PTKIN/satker Kementerian Agama dinilai dalam kerangka SPBE; Rektor memimpin satker, Dekan memimpin unit layanan yang buktinya masuk asesmen.</p>
            <p class="muted" style="margin:.7rem 0 0;font-size:.82rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--leaf);">Pasal 2 Perpres 95/2018 · tujuh prinsip SPBE</p>
            <div class="prinsip">
                <span>Efektivitas</span>
                <span>Keterpaduan</span>
                <span>Kesinambungan</span>
                <span>Efisiensi</span>
                <span>Akuntabilitas</span>
                <span>Interoperabilitas</span>
                <span>Keamanan</span>
            </div>
            <table class="simple">
                <thead>
                    <tr><th>Aturan</th><th>Isi resmi yang relevan</th><th>Implikasi di IAIN Bone</th></tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Perpres 95/2018<br><small style="font-weight:500;color:var(--muted);">SPBE</small></td>
                        <td>SPBE adalah penyelenggaraan pemerintahan memakai TIK untuk layanan kepada pengguna. Pasal 42–44 membedakan layanan administrasi dan layanan publik; pendidikan termasuk layanan publik. Pasal 60: setiap pimpinan Instansi Pusat mengoordinasikan dan menetapkan kebijakan SPBE, serta menunjuk koordinator. Pasal 70–71: pemantauan dan evaluasi berkala; pedoman oleh Menteri PANRB.</td>
                        <td>SK skripsi mahasiswa adalah layanan publik pendidikan. Wajib digital, teraudit, dan berkelanjutan — bukan urusan fakultas yang boleh diabaikan kampus.</td>
                    </tr>
                    <tr>
                        <td>Perpres 132/2022<br><small style="font-weight:500;color:var(--muted);">Arsitektur SPBE Nasional</small></td>
                        <td>Instansi menata arsitektur: kebijakan, tata kelola, manajemen, layanan, infrastruktur, aplikasi, dan keamanan informasi.</td>
                        <td>SIMONS harus masuk peta aplikasi/layanan kampus, bukan aplikasi yang hanya hidup di laptop pengembang.</td>
                    </tr>
                    <tr>
                        <td>Perpres 82/2023<br><small style="font-weight:500;color:var(--muted);">Percepatan transformasi digital</small></td>
                        <td>Mendorong keterpaduan layanan digital. Instansi tidak boleh tertinggal sebagai silo kertas sementara layanan nasional sudah elektronik.</td>
                        <td>Fakultas yang masih mengandalkan loket SK kalah bukti dibanding unit yang sudah bertransaksi elektronik.</td>
                    </tr>
                    <tr>
                        <td>PermenPANRB 59/2020<br><small style="font-weight:500;color:var(--muted);">Pemantauan &amp; evaluasi SPBE</small></td>
                        <td>Mengukur tingkat kematangan; hasilnya indeks SPBE. Dapat dijadikan IKU reformasi birokrasi. Pimpinan menunjuk responden. Asesor menilai bukti, bukan niat. Domain: Kebijakan, Tata Kelola, Manajemen, Layanan. Kematangan layanan: 1 informasi → 2 interaksi → 3 transaksi → 4 kolaborasi → 5 optimum.</td>
                        <td>Website pengumuman = tingkat 1. Form tanpa alur pejabat = tingkat 2. SIMONS (ajuan + putusan + dokumen sah) mengarah ke tingkat 3 Transaksi.</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <section class="slide">
            <p class="kicker">Untuk pimpinan</p>
            <h2>Seberapa butuh pimpinan pada inovasi SPBE ini</h2>
            <p class="lead muted" style="display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;max-width:none;">
                <span class="need-stamp">Kebutuhan: tinggi</span>
                <span>Bukan karena tren IT, melainkan karena penilaian jabatan, indeks SPBE, dan bukti layanan kepada mahasiswa.</span>
            </p>
            <div class="grid cols-2">
                <div class="card">
                    <h3>1. Pimpinan yang dinilai, bukan staf IT</h3>
                    <p>Pasal 60 Perpres 95/2018 menugaskan pimpinan instansi mengoordinasikan SPBE. Di kampus, Rektor adalah pimpinan satker; Dekan adalah pimpinan unit yang layanannya masuk bukti. Indeks SPBE dan asesmen asesor meminta nama pejabat, bukan hanya nama programmer.</p>
                </div>
                <div class="card">
                    <h3>2. Tanpa bukti, nilai layanan macet</h3>
                    <p>Permen PANRB 59/2020: asesor memverifikasi dokumen dan sistem. SOP Word, foto loket, atau “rencana tahun depan” tidak menaikkan kematangan. SIMONS menyediakan bukti hidup: status, log Kabag/Wadek 1/Dekan, PDF, QR, tracking NIM.</p>
                </div>
                <div class="card">
                    <h3>3. Indeks SPBE terkait kinerja dan RB</h3>
                    <p>Target indeks SPBE dijadikan IKU dalam kerangka reformasi birokrasi. Pimpinan yang tidak punya inovasi layanan digital membawa risiko predikat “informasi/reaktif”: tata kelola ada di kertas, layanan belum bertransaksi.</p>
                </div>
                <div class="card">
                    <h3>4. Akuntabilitas keputusan SK</h3>
                    <p>Prinsip akuntabilitas dan keamanan (Pasal 2) menuntut kejelasan siapa memutuskan dan keaslian dokumen. SIMONS menolak loncat wewenang dan menerbitkan SK ber-QR. Itu melindungi pimpinan saat ada sanggahan atau pemeriksaan.</p>
                </div>
            </div>
            <div class="card" style="margin-top:1rem;border-color:#166534;">
                <h3>Apa yang dibutuhkan dari pimpinan sekarang</h3>
                <p>Tetapkan SIMONS sebagai layanan resmi FSHI, dukung rilis di server kampus (bukan hanya localhost), jaga SMTP dan HTTPS, dan pakai jejak sistem saat rapat dan asesmen SPBE. Inovasi ini sudah ada — yang menentukan dampaknya ke indeks kampus adalah pengakuan dan pemakaian pimpinan.</p>
            </div>
        </section>

        <section class="slide">
            <p class="kicker">Agenda</p>
            <h2>Isi presentasi</h2>
            <div class="grid cols-2">
                <div class="card">
                    <h3>1 — SPBE (sudah di awal)</h3>
                    <p>Mandat hukum, kebutuhan pimpinan, dan posisi SIMONS sebagai bukti layanan digital IAIN Bone.</p>
                </div>
                <div class="card">
                    <h3>2 — Konteks</h3>
                    <p>Latar belakang, masalah operasional, tujuan, dan ruang lingkup FSHI IAIN Bone.</p>
                </div>
                <div class="card">
                    <h3>3 — Milestone &amp; alur</h3>
                    <p>Tahapan proyek dan bagan alur aplikasi dari form mahasiswa sampai SK terbit.</p>
                </div>
                <div class="card">
                    <h3>4 — Fungsi, manfaat &amp; durasi</h3>
                    <p>Peran pengguna, dampak operasional, requirement development, dan waktu prakom.</p>
                </div>
                <div class="card">
                    <h3>5 — Aturan tertanam &amp; inovasi</h3>
                    <p>SOP yang sistem tolak jika dilanggar, inovasi gerbang NIM/QR, dan peta domain SPBE.</p>
                </div>
            </div>
        </section>

        <section class="slide">
            <p class="kicker">Latar belakang</p>
            <h2>Mengapa SIMONS diperlukan</h2>
            <p class="lead muted">Penetapan pembimbing dan penguji skripsi di FSHI adalah proses resmi berantai. Sebelum digitalisasi, titik lemahnya bukan pada wewenang pejabat, melainkan pada jejak, keseragaman, dan kecepatan administrasi.</p>
            <div class="grid cols-2">
                <div class="card">
                    <h3>Masalah di lapangan</h3>
                    <ul class="clean">
                        <li>Mahasiswa sulit mengetahui status usulan setelah berkas masuk.</li>
                        <li>Usulan Kaprodi (PDF/kertas) bisa berbeda dengan data yang diketik ulang.</li>
                        <li>Verifikasi Kabag dan Wadek 1 berjalan paralel, sulit dilacak jika salah satu tertahan.</li>
                        <li>Nomor SK, PDF, tanda tangan, dan arsip email dikerjakan terpisah.</li>
                    </ul>
                </div>
                <div class="card">
                    <h3>Mengapa “Non Srikandi”</h3>
                    <ul class="clean">
                        <li>Srikandi adalah sistem persuratan resmi Kemenag.</li>
                        <li>SIMONS tidak menggantinya. Ia mengelola operasional fakultas: usulan skripsi, persetujuan berjenjang, dan terbitnya SK internal.</li>
                        <li>Fokusnya tiga prodi FSHI: HTN (Siyasah), HES (Muamalah), HKI (Ahwal Syakhshiyyah).</li>
                    </ul>
                </div>
            </div>
        </section>

        <section class="slide">

    <script>
        (function () {
            const viewport = document.getElementById('viewport');
            const source = document.getElementById('slides');
            const slides = Array.from(source.content.children);
            slides.forEach(function (slide) { viewport.appendChild(slide); });

            let i = 0;
            const counter = document.getElementById('counter');
            const fill = document.getElementById('fill');

            function show(n) {
                i = Math.max(0, Math.min(slides.length - 1, n));
                slides.forEach(function (slide, idx) {
                    slide.classList.toggle('is-on', idx === i);
                });
                counter.textContent = (i + 1) + ' / ' + slides.length;
                fill.style.width = ((i + 1) / slides.length * 100) + '%';
                viewport.querySelector('.slide.is-on').scrollTop = 0;
            }

            document.getElementById('prev').addEventListener('click', function () { show(i - 1); });
            document.getElementById('next').addEventListener('click', function () { show(i + 1); });
            document.addEventListener('keydown', function (e) {
                if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
                    e.preventDefault();
                    show(i + 1);
                } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                    e.preventDefault();
                    show(i - 1);
                } else if (e.key === 'Home') {
                    show(0);
                } else if (e.key === 'End') {
                    show(slides.length - 1);
                } else if (e.key === 'f' || e.key === 'F') {
                    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
                    else document.exitFullscreen();
                }
            });

            show(0);
        })();
    </script>
